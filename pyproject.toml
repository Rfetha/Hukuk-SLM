# HakHukuk — ÜRÜN paketi. `scripts/` (ölçüm aleti) bilerek DIŞARIDA: kullanıcının kurulumu
# ölçüm hattının 72 dosyalık bağımlılık ağına bağlanmasın (envanter 2026-09-07).
# ⚠️ Sürümler `requirements.lock.txt` ve kurulu ortamdan OKUNARAK yazıldı, tahmin edilmedi.
[project]
name = "hakhukuk"
version = "0.2.0"
description = "Açık kaynak Türk hukuku asistanı — vatandaşın sorabileceği hukuk danışmanı"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "numpy>=2.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.0",   # bge-m3 gömücü — CPU'da koşar, GPU'ya GİRMEZ
    "huggingface-hub>=1.0",         # indeks dağıtımı (S8 kararı (a))
    # TUI. Gerekçe: tek ekranlı arayüzü elle yazmak prompt_toolkit/curses seviyesinde KENDİ
    # MANTIĞINI doğurur; textual bunu hazır verip tui.py'nin answer() üstünde ince kabuk
    # kalmasını sağlıyor (tests/test_tui.py bunu kapı olarak sınıyor).
    "textual==8.2.8",              # ölçülen sürüm, 2026-09-07
]

# ⚠️ ÇEKİRDEK KURULUM ŞİŞMEZ: HTTP API isteğe bağlıdır (Görev 19 karar 6). CLI ve TUI
# kullanan biri `fastapi`/`uvicorn` indirmez. Sürümler kurulu ortamdan OKUNDU (2026-09-10).
[project.optional-dependencies]
api = [
    "fastapi>=0.141",    # ölçülen: 0.141.1
    "uvicorn>=0.52",     # ölçülen: 0.52.4
]

[project.scripts]
hakhukuk = "hakhukuk.cli:main"
hakhukuk-tui = "hakhukuk.tui:main"
hakhukuk-api = "hakhukuk.api:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hakhukuk"]
